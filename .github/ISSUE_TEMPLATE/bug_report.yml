name: Bug Report
description: Report an Issue or Bug with the Flyron
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        We're sorry to hear you have a problem. Can you help us solve it by providing the following details.
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened
      description: What did you expect to happen?
      placeholder: When I try to run an async process, I get an incorrect result
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to Reproduce
      description: How did this occur, please add any command or code used and provide a set of reliable steps if possible.
      placeholder: |
        Using Async or AsyncProcess:
        use JobMetric\Flyron\Facades\Async;
        use JobMetric\Flyron\Facades\AsyncProcess;
        
        $promise = Async::run(fn (int $x) => $x + 1, [41]);
        $value = $promise->run();
        
        Or:
        $pid = AsyncProcess::run(function () {
            file_put_contents(storage_path('app/report.txt'), 'done');
        });
    validations:
      required: true
  - type: input
    id: expected-output
    attributes:
      label: Expected Output
      description: What output did you expect to receive?
      placeholder: "Async process should execute successfully"
    validations:
      required: true
  - type: input
    id: actual-output
    attributes:
      label: Actual Output
      description: What output did you actually receive?
      placeholder: "Async process fails or throws an exception"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: What version of Flyron are you running? Please be as specific as possible
      placeholder: 1.0.0
    validations:
      required: true

